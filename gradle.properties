# Minecraft / Fabric versions — ПРОВЕРЬ актуальные номера на fabricmc.net перед сборкой,
# т.к. 26.2 очень свежая версия и билды API часто обновляются.
minecraft_version=26.2
loader_version=0.18.4
fabric_version=0.156.0+26.2

# Mod properties
mod_version=1.0.0
maven_group=com.example
archives_base_name=potent-sulfur

# Java 25 требуется для сборки под Minecraft 26.x
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
